services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: weathergpt
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: weathergpt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://weathergpt:weathergpt@postgres:5432/weathergpt
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
    depends_on:
      - postgres
    ports:
      - "8000:8000"

volumes:
  postgres_data: